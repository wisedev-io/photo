name: CI
on:
  push:
  pull_request:

jobs:
  # Fast checks that need no Android SDK: rules engine, strings/translations, Compose screens rendered headlessly,
  # and a compile of the Android-specific code against stubs.
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
      - name: Resource checks (keys, placeholders, locales)
        run: |
          python3 tools/check_resources.py
          python3 tools/test_check_resources.py
          python3 tools/test_check_rules_online.py
      - name: Rules engine tests (JVM)
        run: ./gradlew -p core test
      - name: Render every screen in every language (headless Compose)
        run: ./gradlew -p harness desktopTest
      - name: Compile Android code against stubs
        run: tools/check-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: harness/build/screenshots/*.png

  # The real thing: needs the Android SDK.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner image already contains the Android SDK. android-actions/setup-android@v3 fails on it
      # ("Failed to find package 'tools'"), so only accept the licenses and let Gradle fetch what is missing.
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests + debug APK
        run: ./gradlew :core:test :app:assembleDebug
      - name: Android lint
        run: ./gradlew :app:lintDebug
        continue-on-error: true
      - name: Lint findings (text)
        if: always()
        run: cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
      - name: Permissions in the merged manifest (what the installed app can ask for)
        if: always()
        run: |
          for f in $(find app/build/intermediates -path '*merged_manifest*' -name AndroidManifest.xml); do
            echo "== $f"
            grep -E 'uses-permission|uses-feature' "$f" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: dv-photo-debug-apk
          path: app/build/outputs/apk/debug/*.apk

name: CI
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  # Fast checks that need no Android SDK: rules engine, strings/translations, Compose screens rendered headlessly,
  # and a compile of the Android-specific code against stubs.
  logic:
    if: github.event.action != 'closed' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository && vars.DV_PHOTO_PLAY_RELEASE_ENABLED == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
      - name: Resource checks (keys, placeholders, locales)
        run: |
          python3 tools/check_resources.py
          python3 tools/test_check_resources.py
          python3 tools/test_check_rules_online.py
      - name: Rules engine tests (JVM)
        run: ./gradlew -p core test
      - name: Render every screen in every language (headless Compose)
        run: ./gradlew -p harness desktopTest
      - name: Compile Android code against stubs
        run: tools/check-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: harness/build/screenshots/*.png

  # The real thing: needs the Android SDK.
  android:
    if: github.event.action != 'closed' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository && vars.DV_PHOTO_PLAY_RELEASE_ENABLED == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The runner image already contains the Android SDK. android-actions/setup-android@v3 fails on it
      # ("Failed to find package 'tools'"), so only accept the licenses and let Gradle fetch what is missing.
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$(command -v sdkmanager || ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Assign Play version
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository && vars.DV_PHOTO_PLAY_RELEASE_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          version_code=$((2 + GITHUB_RUN_NUMBER))
          sed -i -E "s/^[[:space:]]*versionCode = [0-9]+$/        versionCode = $version_code/" app/build.gradle.kts
          grep -Fx "        versionCode = $version_code" app/build.gradle.kts
      - name: Unit tests, debug APK, and release bundle
        run: ./gradlew :core:test :app:assembleDebug :app:bundleRelease
      - name: Android lint (errors fail the build, warnings do not)
        run: ./gradlew :app:lintDebug :app:lintRelease
      - name: Lint findings (text)
        if: always()
        run: cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
      - name: Permissions in the merged manifest (what the installed app can ask for)
        if: always()
        run: |
          for f in $(find app/build/intermediates -path '*merged_manifest*' -name AndroidManifest.xml); do
            echo "== $f"
            grep -E 'uses-permission|uses-feature' "$f" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: dv-photo-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: dv-photo-unsigned-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Sign the Play upload bundle
        id: sign
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository && vars.DV_PHOTO_PLAY_RELEASE_ENABLED == 'true')
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          PLAY_UPLOAD_KEY_ALIAS: ${{ vars.PLAY_UPLOAD_KEY_ALIAS || 'upload' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PLAY_UPLOAD_KEYSTORE_BASE64" && -z "$PLAY_UPLOAD_KEYSTORE_PASSWORD" ]]; then
            echo "::notice::Play upload signing is not configured. Only the unsigned bundle is available."
            exit 0
          fi
          if [[ -z "$PLAY_UPLOAD_KEYSTORE_BASE64" || -z "$PLAY_UPLOAD_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Configure both Google Play upload signing secrets."
            exit 1
          fi

          keystore="$(mktemp)"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          jarsigner -keystore "$keystore" -storetype PKCS12 \
            -storepass:env PLAY_UPLOAD_KEYSTORE_PASSWORD \
            -signedjar "$RUNNER_TEMP/dv-photo-play.aab" \
            app/build/outputs/bundle/release/app-release.aab "$PLAY_UPLOAD_KEY_ALIAS"
          jarsigner -verify "$RUNNER_TEMP/dv-photo-play.aab"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.signed == 'true'
        with:
          name: dv-photo-play-aab
          path: ${{ runner.temp }}/dv-photo-play.aab
          if-no-files-found: error

  # Merge feature branches into develop. Release by merging a develop-to-main pull request.
  # Configure DV_PHOTO_PLAY_SERVICE_ACCOUNT_JSON with production access for app.dvphoto.camera.
  # Enable DV_PHOTO_PLAY_RELEASE_ENABLED once that secret and the existing upload key are configured.
  play-release:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'develop' && github.event.pull_request.head.repo.full_name == github.repository && vars.DV_PHOTO_PLAY_RELEASE_ENABLED == 'true'
    needs: [logic, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: dv-photo-google-play-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dv-photo-play-aab
          path: play-release
      - name: Require current main
        shell: bash
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Submit production update for Google review
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.DV_PHOTO_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.dvphoto.camera
          releaseFiles: play-release/dv-photo-play.aab
          tracks: production
          status: completed
          changesNotSentForReview: false
